services:
  hg_client_ui:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_HG_API_BASE=${NEXT_PUBLIC_HG_API_BASE:-http://localhost:8080}
      - NEXT_PUBLIC_HG_SSE_URL=${NEXT_PUBLIC_HG_SSE_URL:-http://localhost:8080/sse}
      - NEXT_PUBLIC_HG_WS_URL=${NEXT_PUBLIC_HG_WS_URL:-ws://localhost:8080/ws}
      - NEXT_PUBLIC_HG_DEMO_MODE=${NEXT_PUBLIC_HG_DEMO_MODE:-true}
