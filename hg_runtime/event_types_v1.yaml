# RTC event type registry v1.0 (RTC_EVENT_BUS_SPEC.md §2)
#
# Adding a type = a commit to this file. The registry file hash is recorded in
# RUNTIME_STARTED so every run pins the vocabulary it spoke.
#
# Fields per type:
#   family             ingress | cognition | decision | execution | regulation |
#                      lifecycle | memory | meta | bus
#   priority           0-100; overflow keeps highest first, then newest
#                      (drop-oldest-lowest-priority, never silent)
#   cognition_eligible true if this event type may warrant an LLM proposal pass.
#                      A tick whose batch has no eligible event skips step 6
#                      entirely (RTC_RUNTIME_LOOP_SPEC.md — conditional cognition).

version: "1.0"

